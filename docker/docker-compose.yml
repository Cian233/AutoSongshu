services:
  autosongshu:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: autosongshu
    ports:
      - "8000:8000"
    volumes:
      # Use a named volume for the database (data directory) for better portability and performance
      - autosongshu_data:/app/data
      # Keep artifacts as a host mount so you can easily view screenshots/logs on your machine
      - ../artifacts:/app/artifacts
      # Map configs and skills if they want to modify them from the host
      - ../configs:/app/configs
      - ../skills:/app/skills
    # env_file is optional - you can create .env or use environment variables directly
    # env_file:
    #   - ../.env
    environment:
      # Core Model Configuration (set via environment variables or .env file)
      # Example: export AUTOSONGSHU_MODEL_API_KEY=your-key
      - AUTOSONGSHU_MODEL_NAME
      - AUTOSONGSHU_MODEL_API_KEY
      - AUTOSONGSHU_MODEL_BASE_URL
      # Runtime Settings
      - HOST=0.0.0.0
      - PORT=8000
      - AUTOSONGSHU_DATABASE_URL=sqlite:////app/data/autosongshu.db
      - AUTOSONGSHU_ARTIFACT_DIR=/app/artifacts
      - AUTOSONGSHU_BROWSER_HEADLESS=true
    restart: unless-stopped

volumes:
  # Named volume for database persistence
  autosongshu_data:

