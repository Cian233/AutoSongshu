[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autosongshu-agent"
version = "0.1.0"
description = "Authorized web pentest agent built with AgentScope and CDP support."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agentscope>=1.0.16,<2",
  "beautifulsoup4>=4.14.3,<5",
  "defusedcsv>=3.0.0,<4",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116.0,<1",
  "playwright>=1.58.0,<2",
  "httpx>=0.28.1,<1",
  "httpx-ntlm>=1.4.0,<2",
  "jinja2>=3.1.6,<4",
  "mysql-connector-python>=9.5.0,<10",
  "pydantic>=2.12.5,<3",
  "PySocks>=1.7.1,<2",
  "psycopg[binary]>=3.3.2,<4",
  "python-dotenv>=1.2.2,<2",
  "pymysql>=1.1.1,<2",
  "pyyaml>=6.0.3,<7",
  "requests>=2.32.5,<3",
  "requests-ntlm>=1.3.0,<2",
  "requests-toolbelt>=1.0.0,<2",
  "rich>=14.3.3,<15",
  "sqlalchemy>=2.0.48,<3",
]

[project.scripts]
autosongshu-agent = "autosongshu_agent.cli:main"
autosongshu-web = "autosongshu_agent.webapp:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autosongshu_agent = ["web/templates/*.html", "web/static/*.css", "web/static/*.js"]
